<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ram Guinto | Portfolio</title>
    <link rel="icon" href="/assets/images/ram-guinto.png">
    <meta name="description" content="Personal portfolio of Ram Guinto - Front-end developer, Graphic Designer, and IT student in Manila, Philippines. Check out my projects and interactive skill map.">
    <link rel="preload" as="image" href="assets/images/ram-guinto-text.jpg">
    <link rel="preload" as="image" href="assets/images/ram-guinto-text-light.jpg">
    <script>
      // FOUC prevention: apply theme before first paint
      (function() {
        var theme = localStorage.getItem('theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
